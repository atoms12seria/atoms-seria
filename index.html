<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ここにサイト名</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         背景
    ========================== -->
    <div class="background"></div>


    <!-- =========================
         ヘッダー
    ========================== -->
    <header class="header">

        <!-- アイコン -->
        <img src="icon.png" alt="アイコン" class="icon">

        <div class="header-text">

            <!-- ★ サイト名 -->
            <h1>ここにサイト名</h1>

            <!-- ★ サブタイトル -->
            <p>ここにサブタイトルや説明</p>

        </div>

    </header>


    <!-- =========================
         メイン
    ========================== -->
    <main class="container">


        <!-- =========================
             自己紹介・説明
        ========================== -->
        <section class="card">

            <h2>About</h2>

            <!-- ★ ここに文章 -->
            <p>
                ここにサイトの説明や自己紹介を書いてください。<br>
                好きなことや活動内容などを自由に入力できます。
            </p>

        </section>


        <!-- =========================
             お知らせ
        ========================== -->
        <section class="card">

            <h2>お知らせ</h2>

            <div class="notice">

                <!-- ★ お知らせ1 -->
                <p>
                    <span class="date">2026.09.15</span>
                    ここにお知らせを書きます。
                </p>

                <!-- ★ お知らせ2 -->
                <p>
                    <span class="date">2026.09.01</span>
                    ここに2つ目のお知らせを書きます。
                </p>

            </div>

        </section>


        <!-- =========================
             プロフィール
        ========================== -->
        <section class="card">

            <h2>Profile</h2>

            <div class="profile">

                <img src="icon.png" alt="プロフィール画像">

                <div>

                    <!-- ★ 名前 -->
                    <h3>ここに名前</h3>

                    <!-- ★ プロフィール -->
                    <p>
                        ここにプロフィールを書いてください。<br>
                        好きなもの、趣味、活動など。
                    </p>

                </div>

            </div>

        </section>


        <!-- =========================
             リンク
        ========================== -->
        <section class="card">

            <h2>Links</h2>

            <div class="links">

                <!-- ★ リンク1 -->
                <a href="#" class="link-button">
                    X / Twitter
                </a>

                <!-- ★ リンク2 -->
                <a href="#" class="link-button">
                    YouTube
                </a>

                <!-- ★ リンク3 -->
                <a href="#" class="link-button">
                    その他のリンク
                </a>

            </div>

        </section>


    </main>


    <!-- =========================
         フッター
    ========================== -->
    <footer class="footer">

        <!-- ★ コピーライト -->
        <p>© 2026 ここに名前</p>

    </footer>

</body>
</html>
